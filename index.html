<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="All the art that has been made for my sona.">
<meta property="og:title" content="MR.UNKNOWN">
<meta property="og:description" content="All the art that has been made for my sona.">
<meta property="og:type" content="website">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>MR.UNKNOWN Art Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style id="site-css">
:root{
  /* Layout: oversized condensed name, intro beside a link list, then a typographic genre index over a masonry wall of work */
  --wall:#eceef1;
  --panel:#ffffff;
  --ink:#121419;
  --ink-soft:#596070;
  --rule:#cfd4db;
  --accent:#2337c6;
  --accent-ink:#ffffff;
  --danger:#b42318;
  --display:"Big Shoulders Display","Arial Narrow","Roboto Condensed",sans-serif;
  --body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --gap:clamp(12px,2vw,24px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --wall:#0f1115;--panel:#181b21;--ink:#eceef2;--ink-soft:#9aa1ae;--rule:#2b3039;
    --accent:#8e9bff;--accent-ink:#0b0d14;--danger:#ff8a7a;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --wall:#0f1115;--panel:#181b21;--ink:#eceef2;--ink-soft:#9aa1ae;--rule:#2b3039;
  --accent:#8e9bff;--accent-ink:#0b0d14;--danger:#ff8a7a;color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--wall);color:var(--ink);font:400 16px/1.55 var(--body);-webkit-font-smoothing:antialiased}
body.has-bar{padding-bottom:110px}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.vh{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-soft)}
.wrap{max-width:1320px;margin:0 auto;padding:0 max(16px,4vw)}

/* top + hero */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0 0;min-height:60px}
.top-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn.is-on{background:var(--ink);color:var(--wall)}
.hero{padding:clamp(14px,3.5vw,44px) 0 clamp(32px,5vw,64px);border-bottom:2px solid var(--ink)}
.avatar{width:76px;height:76px;border-radius:50%;object-fit:cover;margin:0 0 16px;background:var(--panel)}
.name{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:clamp(76px,17vw,240px);line-height:.82;letter-spacing:-.005em;margin:0 0 clamp(22px,3vw,40px);text-wrap:balance;overflow-wrap:normal;max-width:100%}
.hero-row{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(24px,4vw,64px);align-items:start}
.tagline{font-size:clamp(19px,2vw,24px);line-height:1.35;margin:0 0 16px;max-width:34ch;text-wrap:pretty}
.intro .btn{margin-top:4px}
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));column-gap:24px}
.links > .btn{grid-column:1/-1;justify-self:start;margin-top:12px}
.link{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"name arrow" "handle arrow";align-items:center;column-gap:12px;padding:12px 0 14px;border-top:1px solid var(--ink);color:var(--ink);text-decoration:none;min-height:66px}
.l-name{grid-area:name;font-family:var(--display);font-weight:800;font-size:27px;line-height:1;text-transform:uppercase;letter-spacing:.01em}
.l-handle{grid-area:handle;margin-top:5px;text-transform:none;overflow-wrap:anywhere}
.l-arrow{grid-area:arrow;font-size:22px;line-height:1;transition:transform .2s ease}
a.link:hover,a.link:hover .l-handle{color:var(--accent)}
a.link:hover .l-arrow{transform:translate(3px,-3px)}
.link.is-example{color:var(--ink-soft);border-top-style:dashed}
.tag{display:inline-block;font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;line-height:1;padding:4px 6px;border:1px solid currentColor;border-radius:2px;vertical-align:middle;margin-left:8px;color:var(--ink-soft)}

/* work */
.work{padding:clamp(28px,4vw,48px) 0 clamp(24px,4vw,48px)}
.work-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:10px}
.work-head h2{font-family:var(--display);font-weight:900;font-size:clamp(20px,2.4vw,28px);text-transform:uppercase;letter-spacing:.08em;margin:0}
.work-head .btn{margin-left:auto;align-self:center}
.index{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:.22em;margin:0 0 clamp(22px,3vw,40px);font-family:var(--display);font-size:clamp(30px,6.2vw,76px);line-height:1.02}
.gbtn{background:none;border:0;padding:.03em 0;margin:0;cursor:pointer;font:inherit;font-weight:800;text-transform:uppercase;color:var(--ink-soft);text-decoration:underline;text-decoration-color:transparent;text-decoration-thickness:.075em;text-underline-offset:.1em;transition:color .15s ease,text-decoration-color .15s ease}
.gbtn:hover{color:var(--ink)}
.gbtn[aria-pressed="true"]{color:var(--accent);text-decoration-color:currentColor}
.gbtn sup{display:inline-block;font-family:var(--mono);font-size:clamp(10px,.19em,14px);font-weight:500;letter-spacing:0;vertical-align:top;position:relative;top:.35em;margin-left:.25em}
.gi{white-space:nowrap}
.sep{color:var(--rule);font-weight:400;margin-left:.22em}
.t18{display:inline-block;font-family:var(--mono);font-size:clamp(10px,.2em,14px);font-weight:500;letter-spacing:.02em;line-height:1;padding:.3em .45em;border:1.5px solid currentColor;border-radius:3px;vertical-align:middle;position:relative;top:-.12em;margin-left:.3em;text-decoration:none}
.grid{columns:4 240px;column-gap:var(--gap)}
.piece{break-inside:avoid;margin:0 0 var(--gap);display:block}
.piece[hidden]{display:none}
.piece.in{animation:pin .35s ease both}
@keyframes pin{from{opacity:0;transform:translateY(8px)}}
.frame{position:relative;background:var(--panel)}
.open{display:block;width:100%;padding:0;margin:0;border:0;background:none;cursor:zoom-in}
.open img{width:100%;height:auto;transition:opacity .2s ease}
.open:hover img{opacity:.9}
.on-img{position:absolute;top:8px}
.tag.on-img{left:8px;margin:0;background:var(--panel);color:var(--ink)}
.edit-btn{right:8px;background:var(--panel)}
.cap{padding:10px 0 2px}
.cap h3{font:600 15px/1.3 var(--body);margin:0 0 3px;overflow-wrap:anywhere}
.cap .mono{font-size:11px;margin:0;line-height:1.45;text-transform:none;letter-spacing:.02em}
.add-tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;aspect-ratio:4/5;border:2px dashed var(--ink-soft);color:var(--ink);cursor:pointer;text-align:center;padding:16px;font-weight:600;background:transparent}
.add-tile:hover{border-color:var(--accent);color:var(--accent)}
.add-tile{width:100%;font:600 15px/1.3 var(--body)}
.add-tile:disabled{opacity:.45;cursor:not-allowed}
.add-tile .plus{font-family:var(--display);font-size:72px;line-height:.8;font-weight:800}
.add-tile .mono{font-size:10px}
.add-tile.busy{opacity:.45;pointer-events:none}
.add-piece:focus-within .add-tile{outline:2px solid var(--accent);outline-offset:2px}
.empty{padding:28px 0;margin:0}
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:22px 0 40px;border-top:1px solid var(--rule)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:8px 16px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);font:600 14px/1.2 var(--body);border-radius:999px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s ease,color .15s ease,border-color .15s ease}
.btn:hover{background:var(--ink);color:var(--wall)}
.btn-small{min-height:34px;padding:6px 13px;font-size:13px}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{background:var(--ink);border-color:var(--ink);color:var(--wall)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:disabled:hover{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn-primary:disabled:hover{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn-danger{border-color:var(--danger);color:var(--danger)}
.btn-danger:hover{background:var(--danger);border-color:var(--danger);color:var(--panel)}
.btn.armed,.btn.armed:hover{background:var(--danger);border-color:var(--danger);color:#fff}
.icon{width:40px;height:40px;flex:0 0 40px;display:inline-grid;place-items:center;border:1px solid var(--rule);border-radius:4px;background:transparent;color:var(--ink);cursor:pointer;font-size:16px;line-height:1;padding:0}
.icon:hover{border-color:var(--ink)}
.icon:disabled{opacity:.35;cursor:default}
.icon.danger:hover{border-color:var(--danger);color:var(--danger)}

/* edit bar */
.editbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:2px solid var(--ink);padding:12px 0 calc(12px + env(safe-area-inset-bottom))}
.editbar-in{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap}
.eb-status{font-size:14px;line-height:1.35;color:var(--ink-soft);max-width:52ch}
.eb-status b{color:var(--ink);font-weight:600}
.eb-actions{display:flex;gap:8px;flex-wrap:wrap}

/* dialogs */
.dlg{border:0;padding:0;width:min(620px,calc(100% - 24px));max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px);background:var(--panel);color:var(--ink);border-radius:6px;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.dlg::backdrop{background:rgba(8,10,14,.62)}
.dlg-form{display:flex;flex-direction:column;max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px);margin:0}
.dlg-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px 14px 20px;border-bottom:1px solid var(--rule)}
.dlg-head h2{margin:0;font-family:var(--display);font-weight:800;font-size:28px;line-height:1;text-transform:uppercase;letter-spacing:.02em}
.dlg-body{padding:18px 20px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.dlg-foot{display:flex;gap:8px;justify-content:flex-end;align-items:center;padding:14px 20px;border-top:1px solid var(--rule);flex-wrap:wrap}
.spacer{flex:1}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.label{font-family:var(--mono);font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft)}
.field input,.field select,.field textarea{width:100%;font:400 16px/1.4 var(--body);color:var(--ink);background:var(--wall);border:1px solid var(--rule);border-radius:4px;padding:10px 12px;min-height:44px}
.field textarea{resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.row2{display:grid;grid-template-columns:2fr 1fr;gap:12px}
.hint{margin:0;color:var(--ink-soft);font-size:14px}
.err{margin:0;color:var(--danger);font-size:14px}
.err:empty{display:none}
.lrows{display:flex;flex-direction:column;gap:12px}
.lrow,.genre-row{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:10px;align-items:end;padding-bottom:12px;border-bottom:1px solid var(--rule)}
.genre-row{grid-template-columns:minmax(0,1fr) auto auto auto}
.chk{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding-bottom:0;font:600 14px/1 var(--body);cursor:pointer;white-space:nowrap}
.chk input{width:18px;height:18px;accent-color:var(--accent);margin:0}
@media (max-width:520px){.genre-row{grid-template-columns:minmax(0,1fr) auto;}.genre-row .lrow-tools{grid-column:1/-1;justify-content:flex-end}}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:26px 16px;border:2px dashed var(--ink-soft);border-radius:6px;text-align:center;cursor:pointer;background:var(--wall);transition:border-color .15s ease,background .15s ease}
.drop:hover,.drop.over{border-color:var(--accent)}
.drop.over{background:var(--panel)}
.drop-big{font-family:var(--display);font-weight:800;font-size:26px;text-transform:uppercase;line-height:1}
#up-files:focus-visible + * , .drop:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.uq{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.uq:empty{display:none}
.uq-item{position:relative;aspect-ratio:1;background:var(--wall);border-radius:3px;overflow:hidden;display:grid;place-items:center}
.uq-item img{width:100%;height:100%;object-fit:cover}
.uq-item .mono{font-size:10px;padding:4px;overflow-wrap:anywhere;text-align:center}
.uq-item.is-up img{opacity:.5}
.uq-x,.uq-badge{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:999px;display:grid;place-items:center;font-size:12px;line-height:1;border:0;background:var(--ink);color:var(--wall)}
.uq-x{cursor:pointer}
.uq-badge.ok{background:var(--accent);color:var(--accent-ink)}
.uq-badge.bad{background:var(--danger);color:#fff}
.age-lead{margin:0;font-size:19px;line-height:1.4}
.genre-row .mono{padding-bottom:12px;white-space:nowrap}
.lrow-tools{display:flex;gap:6px}
.pd{display:grid;grid-template-columns:150px minmax(0,1fr);gap:18px;align-items:start}
.pd-img img{width:100%;border-radius:2px;background:var(--wall)}
.pd-fields{display:flex;flex-direction:column;gap:14px}
.move{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.av-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.av-prev{width:56px;height:56px;border-radius:50%;background:var(--wall);overflow:hidden;border:1px solid var(--rule)}
.av-prev img{width:100%;height:100%;object-fit:cover}

/* lightbox */
.lb{border:0;padding:0;margin:0;width:100vw;height:100vh;height:100dvh;max-width:100vw;max-height:100vh;max-height:100dvh;background:#0b0c10;color:#eceef2}
.lb::backdrop{background:#0b0c10}
.lb-in{display:grid;grid-template-rows:auto minmax(0,1fr) auto;height:100%}
.lb-bar{display:flex;justify-content:space-between;align-items:center;padding:12px 16px}
.lb-bar .mono,.lb-cap .mono{color:#9aa1ae}
.lb-x,.lb-nav button{width:46px;height:46px;border:1px solid #3a3f4a;background:transparent;color:#eceef2;border-radius:999px;cursor:pointer;font-size:18px;line-height:1}
.lb-x:hover,.lb-nav button:hover{border-color:#eceef2}
.lb-nav button:disabled{opacity:.3;cursor:default}
.lb-stage{display:flex;align-items:center;justify-content:center;padding:0 16px;min-height:0;height:100%;overflow:hidden}
.lb-stage img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}
.lb-cap{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding:16px max(16px,4vw) calc(20px + env(safe-area-inset-bottom))}
.lb-cap h2{font-family:var(--display);font-weight:800;font-size:clamp(28px,3.4vw,42px);text-transform:uppercase;margin:0 0 6px;line-height:1}
.lb-cap .mono{margin:0}
.lb-note{margin:10px 0 0;max-width:60ch;color:#c9cdd6;font-size:15px;white-space:pre-line}
.lb-credit{margin:0 0 6px;font-size:15px;color:#c9cdd6}
.lb-credit a{color:#aab4ff;text-decoration:none;border-bottom:1px solid currentColor}
.lb-credit a:hover{color:#fff}
.lb-nav{display:flex;gap:8px;flex-shrink:0}

/* toast */
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);opacity:0;pointer-events:none;background:var(--ink);color:var(--wall);padding:11px 18px;border-radius:999px;font-size:14px;font-weight:500;z-index:50;transition:opacity .2s ease,transform .2s ease;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
body.has-bar .toast{bottom:120px}

@media (max-width:760px){
  .hero-row{grid-template-columns:1fr}
}
@media (max-width:640px){
  .grid{columns:2;column-gap:12px}
  .piece{margin-bottom:16px}
  .cap h3{font-size:14px}
  .lrow{grid-template-columns:1fr}
  .lrow-tools{justify-content:flex-end}
  .pd{grid-template-columns:1fr}
  .pd-img{max-width:150px}
  .row2{grid-template-columns:1fr 1fr}
  .work-head .btn{margin-left:0}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
}
</style>
</head>

    var skin = pick(['#e9c2a6', '#c68f6d', '#8d5a3b', '#f1d3bd', '#b07a58']);
    var shirt = pick(['#16181d', '#2f6b4f', '#3b3f8f', '#7a2e2e', '#e7e3da']);

    x.beginPath(); x.moveTo(cx + m * .005, ey + m * .015); x.lineTo(cx - m * .018, ey + m * .07); x.lineTo(cx + m * .008, ey + m * .075); x.stroke();
    x.beginPath(); x.moveTo(cx - m * .032, ey + m * .112); x.quadraticCurveTo(cx, ey + m * .124, cx + m * .032, ey + m * .112); x.stroke();
    grain(x, w, h, r, .05);
  },
  digital: function(x, w, h, r, pick){
    var neon = ['#7d8cff', '#ff4fa3', '#21e6c1', '#ffd166', '#9b5cff', '#3ad0ff'];
    x.fillStyle = '#0d0f1a'; x.fillRect(0, 0, w, h);

    }

  },
  sketch: function(x, w, h, r){

        px = Math.min(w * .95, Math.max(w * .05, nx)); py = Math.min(h * .95, Math.max(h * .05, ny));

function genArt(g){
  var key = g.k + ':' + g.s + ':' + g.w + 'x' + g.h;
  if (genCache.has(key)) return genCache.get(key);
  var url = '';
  try {
    var c = D.createElement('canvas'); c.width = g.w; c.height = g.h;
    var x = c.getContext('2d'), r = rng(g.s * 9973 + 17);
    var pick = function(a){ return a[Math.floor(r() * a.length)]; };
    (ART[g.k] || ART.abstract)(x, g.w, g.h, r, pick);
    url = c.toDataURL('image/jpeg', .86);
  } catch(e){ url = ''; }
  genCache.set(key, url);
  return url;
}

/* ---------- image sources ---------- */
function thumbSrc(p){ if (p.gen) return genArt(p.gen); if (p.thumb) return blobUrl(p.thumb.id); if (p.img) return blobUrl(p.img.id); return ''; }
function fullSrc(p){ if (p.gen) return genArt(p.gen); if (p.img) return blobUrl(p.img.id); return thumbSrc(p); }
function ratio(p){
  var w = p.gen ? p.gen.w : (p.img && p.img.w), h = p.gen ? p.gen.h : (p.img && p.img.h);
  return (w && h) ? (w + ' / ' + h) : 'auto';
}
function handleUrl(h){
  h = String(h || '').trim(); if (!h) return '';
  if (/^https?:\/\/[^\s]+$/i.test(h)) return h;
  var m = h.replace(/^@/, '');
  return /^[A-Za-z0-9_]{1,30}$/.test(m) ? 'https://x.com/' + m : '';
}
function handleText(h){
  h = String(h || '').trim(); if (!h) return '';
  if (/^https?:\/\//i.test(h)) return h.replace(/^https?:\/\/(www\.)?/i, '').replace(/\/$/, '');
  return '@' + h.replace(/^@/, '');
}
function pieceName(p){ return p.title || p.artist || 'Untitled'; }
function artistKey(p){
  if (p.handle) return handleText(p.handle).toLowerCase();
  var a = String(p.artist || '').trim().toLowerCase();
  return (!a || a === 'anon' || a === '[redacted]') ? '' : a;
}
function metaLine(p, inLightbox){
  var parts = [];
  if (inLightbox){ var gn = genreName(p.genre); if (gn) parts.push(gn); }
  parts.push('No. ' + pad(p.no));
  if (!inLightbox){
    if (p.title && p.artist) parts.push('by ' + p.artist);
    if (p.handle) parts.push(handleText(p.handle));
  }
  if (p.year) parts.push(p.year);
  if (p.medium) parts.push(p.medium);
  if (inLightbox && p.size) parts.push(p.size);
  return parts.map(esc).join(' · ');
}
function creditHTML(p){
  var bits = [];
  if (p.title && p.artist) bits.push('Art by ' + esc(p.artist));
  var ht = handleText(p.handle), hu = handleUrl(p.handle);
  if (ht) bits.push(hu ? '<a href="' + esc(hu) + '" target="_blank" rel="noopener noreferrer">' + esc(ht) + ' ↗</a>' : esc(ht));
  return bits.length ? '<p class="lb-credit">' + bits.join(' · ') + '</p>' : '';
}

/* shrink the big name until its longest word fits the width */
function fitName(){

  el.style.fontSize = '';
  for (var k = 0; k < 4 && el.scrollWidth > el.clientWidth + 1; k++){
    var cur = parseFloat(getComputedStyle(el).fontSize);
    el.style.fontSize = Math.max(28, Math.floor(cur * (el.clientWidth / el.scrollWidth) * 0.98)) + 'px';
  }
}
var fitT = 0;
window.addEventListener('resize', function(){ clearTimeout(fitT); fitT = setTimeout(fitName, 80); });

function applyFilter(animate){
  var valid = filter === 'all' ||
    (filter === 'none' && state.pieces.some(function(p){ return genreKey(p) === 'none'; })) ||
    state.genres.some(function(g){ return g.id === filter; });
  if (!valid || (isNsfwGenre(filter) && !adultOK)) filter = 'all';
  var n = 0, artists = new Set();
  app.querySelectorAll('article.piece').forEach(function(el){
    var show = filter === 'all' ? !el.dataset.n : el.dataset.g === filter;
    el.hidden = !show;
    el.classList.remove('in');
    if (show){ n++; if (el.dataset.a) artists.add(el.dataset.a); if (animate){ void el.offsetWidth; el.classList.add('in'); } }
  });
  app.querySelectorAll('.gbtn').forEach(function(b){ b.setAttribute('aria-pressed', String(b.dataset.g === filter)); });
  var cnt = D.getElementById('work-count');
  if (cnt) cnt.textContent = n + (n === 1 ? ' piece' : ' pieces') + (artists.size ? ' · ' + artists.size + (artists.size === 1 ? ' artist' : ' artists') : '');
  var empty = D.getElementById('empty');
  if (empty){
    empty.hidden = n > 0;
    var nm = filter === 'none' ? 'Unsorted' : genreName(filter);
    empty.textContent = filter === 'all' ? (canEdit ? 'No artwork yet. Use Upload art to add your first piece.' : 'No artwork yet.') : 'Nothing in ' + nm + ' yet.';
  }
}
function isNsfwGenre(id){ var g = state.genres.find(function(x){ return x.id === id; }); return !!(g && g.nsfw); }

function setFilter(key){

  var slug = key === 'all' ? 'all' : key === 'none' ? 'unsorted' : genreSlugs()[key];
  if (slug && decodeURIComponent(location.hash.slice(1)) !== slug){ try { location.hash = slug; } catch(e){} }
}
function filterFromHash(){

        }).catch(function(x){ q.state = 'error'; q.err = errMsg(x, q.file.name + ' did not upload.'); }).then(function(){ drawQ(); return next(); });
      };
      next().then(function(){
        uploading = false; busy = false;
        var failed = queue.filter(function(q){ return q.state === 'error'; });
        if (!added.length){ err.textContent = 'Nothing was uploaded. ' + (failed[0] ? failed[0].err : ''); drawQ(); return; }
        state.pieces = added.concat(state.pieces);
        dirty = true; saveDraft();
        if (isNsfwGenre(meta.genre)) adultOK = true;
        filter = meta.genre || 'none';
        go.disabled = true; go.textContent = 'Publishing…';
        var msg = 'Published. ' + added.length + (added.length === 1 ? ' new piece is' : ' new pieces are') + ' live.' +
          (failed.length ? ' ' + failed.length + ' did not upload: ' + failed[0].err : '');
        publishNow(msg).then(function(){
          queue.forEach(function(q){ if (q.url) URL.revokeObjectURL(q.url); });
          closeDialog(); render();
        });
      });
    }
  });
}
function hasFiles(e){ var t = e.dataTransfer && e.dataTransfer.types; return !!t && Array.prototype.indexOf.call(t, 'Files') > -1; }
window.addEventListener('dragover', function(e){ if (canEdit && hasFiles(e)) e.preventDefault(); });
window.addEventListener('drop', function(e){
  if (!canEdit || !hasFiles(e)) return;
  e.preventDefault();
  if (dlg.open || busy) return;
  var files = Array.prototype.filter.call(e.dataTransfer.files || [], isImageFile);
  if (files.length) openUploader(files);
});

/* ---------- draft, publish, discard ---------- */
function hashStr(s){ var h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return h + ':' + s.length; }
function baseHash(){ return hashStr(JSON.stringify(published)); }
function saveDraft(){
  if (!canEdit) return;
  try { localStorage.setItem(DRAFT_KEY, JSON.stringify({base:baseHash(), dirty:dirty, state:state, uploads:Array.from(newUploads)})); } catch(e){}
}
function clearDraft(){ try { localStorage.removeItem(DRAFT_KEY); } catch(e){} }
function restoreDraft(){
  try {
    var d = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null');
    if (!d) return false;
    if (d.base !== baseHash()){ clearDraft(); return false; }
    (d.uploads || []).forEach(function(id){ newUploads.add(id); });
    if (d.dirty && d.state){ state = d.state; dirty = true; editing = true; return true; }
  } catch(e){}
  return false;
}
function markDirty(){ dirty = true; saveDraft(); render(); }

var S = 'scr' + 'ipt';
var HEAD = '<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n';
var FONTS = '<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n' +
  ['Big+Shoulders+Display:wght@700;800;900', 'Hanken+Grotesk:wght@400;500;600', 'IBM+Plex+Mono:wght@400;500'].map(function(f){
    return '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=' + f + '&amp;display=swap">';
  }).join('\n') + '\n';
function pageTitle(s){ return ((s.profile && s.profile.name) || 'Artist') + ' Art Portfolio'; }
function buildDocument(s){
  var css = D.getElementById('site-css').textContent;
  var js = D.getElementById('app-js').textContent;
  var data = JSON.stringify(s).replace(/</g, '\\u003c').replace(/>/g, '\\u003e').replace(/&/g, '\\u0026').replace(/\u2028/g, '\\u2028').replace(/\u2029/g, '\\u2029');
  return '<!DOCTYPE html>\n<html lang="en">\n<head>\n' + HEAD + '<title>' + esc(pageTitle(s)) + '</title>\n' + FONTS +
    '<style id="site-css">' + css + '</style>\n</head>\n<body>\n<div id="app"></div>\n' +
    '<' + S + ' type="application/json" id="site-data">' + data + '</' + S + '>\n' +
    '<' + S + ' id="app-js">' + js + '</' + S + '>\n</body>\n</html>\n';
}
function publishNow(msg){
  if (!caps.artifact){ toast('Publishing is only available to the site owner.'); return Promise.resolve(false); }
  busy = true;
  var next = clone(state); next.updated = today();
  var after = refs(next);
  var candidates = new Set(Array.from(refs(published)).concat(Array.from(newUploads)));
  pendingToast = msg || 'Published. Your site is up to date.';
  return Promise.resolve().then(function(){ return caps.artifact.publish(buildDocument(next)); }).then(function(){
    clearDraft();
    candidates.forEach(function(id){ if (!after.has(id) && caps.assets){ caps.assets.delete(id).catch(function(){}); } });
    published = next; state = clone(next); dirty = false; editing = false; busy = false; newUploads.clear();
    render(); toast(pendingToast, 6000);
    return true;
  }, function(e){
    pendingToast = null; busy = false; render();
    var c = String((e && (e.code || e.message)) || e);
    if (/conflict/i.test(c)) toast('A newer version was published elsewhere. The page will reload to it.', 7000);
    else if (/not_granted|not_writer/i.test(c)) toast("This account can't publish changes to this page.", 7000);
    else toast('Publishing failed (' + c + '). Your changes are saved here; tap Publish changes to try again.', 8000);
    return false;
  });
}
function publish(btn){
  if (!caps.artifact || busy || !dirty) return;
  btn.disabled = true; btn.textContent = 'Publishing…';
  publishNow();
}
function discard(){
  var keep = refs(published);
  newUploads.forEach(function(id){ if (!keep.has(id) && caps.assets) caps.assets.delete(id).catch(function(){}); });
  newUploads.clear(); state = clone(published); dirty = false; clearDraft(); render();
  toast('Changes discarded.');
}
function removeExamples(){
  state.pieces = state.pieces.filter(function(p){ return !p.example; });
  state.links = state.links.filter(function(l){ return !l.example; });
  state.nextNo = state.pieces.reduce(function(m, p){ return Math.max(m, p.no || 0); }, 0) + 1;
  markDirty(); toast('Examples removed. Publish when your own work is in.');
}

/* ---------- lightbox ---------- */
var lb = D.createElement('dialog'); lb.className = 'lb'; lb.setAttribute('aria-label', 'Artwork viewer'); D.body.appendChild(lb);
var lbList = [], lbIdx = 0, touchX = null;
function openLightbox(id){
  lbList = state.pieces.filter(function(p){ return filter === 'all' ? !isNsfw(p) : genreKey(p) === filter; });
  lbIdx = Math.max(0, lbList.findIndex(function(p){ return p.id === id; }));
  drawLb();
  if (!lb.open){ if (lb.showModal) lb.showModal(); else lb.setAttribute('open', ''); }
  var x = lb.querySelector('.lb-x'); if (x) x.focus();
}
function drawLb(){
  var p = lbList[lbIdx]; if (!p) return;
  var many = lbList.length > 1;
  lb.innerHTML = '<div class="lb-in">' +
    '<div class="lb-bar"><span class="mono">' + (lbIdx + 1) + ' / ' + lbList.length + '</span><button type="button" class="lb-x" data-lb="close" aria-label="Close">✕</button></div>' +
    '<div class="lb-stage"><img src="' + esc(fullSrc(p)) + '" alt="' + esc(p.title || 'Artwork') + '"></div>' +
    '<div class="lb-cap"><div><h2>' + esc(pieceName(p)) + '</h2>' + creditHTML(p) + '<p class="mono">' + metaLine(p, true) + '</p>' +
      (p.note ? '<p class="lb-note">' + esc(p.note) + '</p>' : '') + '</div>' +
      '<div class="lb-nav"><button type="button" data-lb="prev" aria-label="Previous"' + (many ? '' : ' disabled') + '>←</button><button type="button" data-lb="next" aria-label="Next"' + (many ? '' : ' disabled') + '>→</button></div>' +
    '</div></div>';
}
function step(d){
  if (lbList.length < 2) return;
  var had = D.activeElement && D.activeElement.dataset ? D.activeElement.dataset.lb : null;
  lbIdx = (lbIdx + d + lbList.length) % lbList.length; drawLb();
  var f = had ? lb.querySelector('[data-lb="' + had + '"]') : null; if (f) f.focus();
}
lb.addEventListener('click', function(e){
  var b = e.target.closest('[data-lb]');
  if (b){ var a = b.dataset.lb; if (a === 'close') lb.close(); else step(a === 'next' ? 1 : -1); return; }
  if (e.target === lb || e.target.classList.contains('lb-stage')) lb.close();
});
lb.addEventListener('keydown', function(e){
  if (e.key === 'ArrowRight'){ e.preventDefault(); step(1); }
  else if (e.key === 'ArrowLeft'){ e.preventDefault(); step(-1); }
});
lb.addEventListener('touchstart', function(e){ touchX = e.touches[0].clientX; }, {passive:true});
lb.addEventListener('touchend', function(e){
  if (touchX == null) return;
  var dx = e.changedTouches[0].clientX - touchX; touchX = null;
  if (Math.abs(dx) > 50) step(dx < 0 ? 1 : -1);
});

/* ---------- events ---------- */
D.addEventListener('click', function(e){
  var t = e.target.closest('[data-act]'); if (!t || !app.contains(t)) return;
  switch (t.dataset.act){
    case 'filter': setFilter(t.dataset.g); break;
    case 'open': openLightbox(t.dataset.id); break;
    case 'toggle-edit': editing = !editing; render(); break;
    case 'upload': openUploader(); break;
    case 'edit-profile': editProfile(); break;
    case 'edit-links': editLinks(); break;
    case 'edit-genres': editGenres(); break;
    case 'edit-piece': editPiece(t.dataset.id); break;
    case 'publish': publish(t); break;
    case 'discard': if (confirmTap(t, 'Tap again to discard')) discard(); break;
    case 'remove-examples': if (confirmTap(t, 'Tap again to remove')) removeExamples(); break;
  }
});
window.addEventListener('hashchange', function(){
  var f = filterFromHash(); if (!f || f === filter) return;
  if (isNsfwGenre(f) && !adultOK){ ageGate(f); return; }
  filter = f; applyFilter(true);
});

/* ---------- capabilities ---------- */
function initCaps(){
  if (capsStarted) return;
  var c = window.claude;
  if (!c || typeof c.use !== 'function') return;
  capsStarted = true;
  Promise.all([c.use('artifact'), c.use('assets')]).then(function(r){
    caps.artifact = r[0]; caps.assets = r[1];
    if (caps.artifact && caps.assets){
      canEdit = true;
      if (restoreDraft()) toast('Your unpublished changes are back.');
      render();
    }
  }).catch(function(){});
}

/* ---------- boot ---------- */
function boot(data){
  data = data || {};
  if (data.adultOK) adultOK = true;
  var f = filterFromHash();
  filter = (f && f !== 'all') ? f : (data.filter || 'all');
  var gated = isNsfwGenre(filter) && !adultOK ? filter : null;
  if (gated) filter = 'all';
  render();
  if (gated) ageGate(gated);
  if (data.toast) setTimeout(function(){ toast(data.toast, 6000); }, 300);
  initCaps();
  if (!capsStarted) window.addEventListener('load', initCaps, {once:true});
}
var hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) hot.snapshot(function(){ return {filter:filter, toast:pendingToast, adultOK:adultOK}; });
if (hot && hot.ready) hot.ready(boot); else boot((hot && hot.data) || {});
})();
</script>
